<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
    <style>
        body {
            padding: 0;
            margin: 0;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            display: block;
        }

        #p5_loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #38314e;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-family: sans-serif;
        }

        .loader-container {
            text-align: center;
        }

        .tennis-ball {
            font-size: 80px;
            animation: bounce 0.4s infinite alternate cubic-bezier(0.5, 0.05, 1, 0.5);
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-80px);
            }
        }

        .loading-text {
            margin-top: 20px;
            color: #FFD700;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 4px;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from {
                opacity: 1;
            }

            to {
                opacity: 0.3;
            }
        }
    </style>
</head>

<body>
    <div id="p5_loading">
        <div class="loader-container">
            <div class="tennis-ball">🎾</div>
            <div class="loading-text">LOADING...</div>
        </div>
    </div>
    <script src="src/scenes/Scene_Menu.js"></script>
    <script src="src/scenes/Scene_CharSelect.js"></script>
    <script src="src/scenes/Scene_Pause.js"></script>
    <script src="src/scenes/Scene_MapSelect.js"></script>
    <script src="src/scenes/Scene_Game.js"></script>
    <script src="src/scenes/Scene_Tutorial.js"></script>
    <script src="src/scenes/Scene_DifficultySelect.js"></script>
    <script src="src/scenes/Scene_Settings.js"></script>
    <script src="src/config/constants.js"></script>
    <script src="src/managers/ScoreManager.js"></script>
    <script src="src/managers/LayoutManager.js"></script>
    <script src="src/managers/SkillManager.js"></script>
    <script src="src/managers/SoundManager.js"></script>
    <script src="src/managers/TutorialManager.js"></script>
    <script src="src/managers/UIManager.js"></script>
    <script src="src/managers/MapManager.js"></script>
    <script src="src/entities/Player.js"></script>
    <script src="src/entities/Ball.js"></script>
    <script src="src/entities/AI.js"></script>
    <script src="src/sketch.js"></script>
    
</body>

</html>
